name: Tests

on: [push]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install
      run: pip install -e ".[testing]"
    - name: Test with pytest
      shell: bash
      run: |
        pytest tests/ -p no:randomly > out.txt 2>&1 || {
          grep -E "^(E  |FAILED|ERROR)|Error" out.txt | head -40 | sed 's/^/::error::/'
          exit 1
        }
